<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字法治文化馆</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;padding:20px;gap:30px;
  }
  .logo{text-align:center}
  .logo .icon{font-size:4rem;margin-bottom:10px}
  .logo h1{
    font-size:2rem;font-weight:700;letter-spacing:6px;
    background:linear-gradient(180deg,#f0d78c 0%,#c9a96e 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .logo p{color:#a09080;font-size:.85rem;margin-top:6px}
  .cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:700px}
  .card{
    background:rgba(255,255,255,.06);border:1px solid rgba(201,169,110,.3);
    border-radius:16px;padding:24px 28px;width:280px;text-align:center;
    text-decoration:none;color:#f0d78c;transition:all .3s;
    backdrop-filter:blur(10px);
  }
  .card:hover{
    background:rgba(255,255,255,.12);border-color:#c9a96e;
    transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .card .emoji{font-size:3rem;margin-bottom:12px}
  .card h2{font-size:1.2rem;margin-bottom:8px}
  .card p{color:#a09080;font-size:.8rem;line-height:1.5}
  .footer{color:#605850;font-size:.7rem;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="logo">
  <div class="icon">🏛️</div>
  <h1>数字法治文化馆</h1>
  <p>Digital Rule of Law Culture Museum · 全国3D大赛参赛作品</p>
</div>
<div class="cards">
  <a class="card" href="museum.html">
    <div class="emoji">🏛️</div>
    <h2>3D 法治文化展馆</h2>
    <p>虚拟3D展厅 · 法治历程、经典案例、法律典籍、法治成就四大展区 · 沉浸式漫游体验</p>
  </a>
  <a class="card" href="vocab-app.html">
    <div class="emoji">📖</div>
    <h2>四级单词天天背</h2>
    <p>500+四级核心词汇 · 翻转卡片记忆 · 三种测验模式 · 每日打卡 · 30词目标</p>
  </a>
</div>
<p class="footer">2026 · 全国三维数字化创新设计大赛 · 数字文化设计</p>
</body>
</html>
