<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四级单词天天背</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--card:#fff;--primary:#4f6ef7;--primary-dark:#3b54d4;
  --success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--text:#1e293b;
  --text2:#64748b;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:0 10px 25px rgba(0,0,0,.1);--radius:12px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;justify-content:center;padding:16px;
}
.app{width:100%;max-width:600px;display:flex;flex-direction:column;gap:14px;padding-bottom:20px}

header{text-align:center;padding:6px 0}
header h1{font-size:1.5rem;font-weight:700;color:var(--primary)}
header p{color:var(--text2);font-size:.8rem;margin-top:2px}

/* Streak badge */
.streak-badge{
  display:flex;align-items:center;justify-content:center;gap:16px;
  background:var(--card);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);
}
.streak-item{text-align:center}
.streak-item .val{font-size:1.3rem;font-weight:700}
.streak-item .lbl{font-size:.7rem;color:var(--text2)}
.streak-item.fire .val{color:#f59e0b}
.streak-item.today .val{color:var(--primary)}
.streak-divider{width:1px;height:30px;background:var(--border)}

/* Tabs */
.tabs{display:flex;background:var(--card);border-radius:var(--radius);padding:3px;box-shadow:var(--shadow)}
.tab{
  flex:1;padding:9px 4px;text-align:center;border:none;background:transparent;
  cursor:pointer;border-radius:9pxx;font-size:.8rem;font-weight:500;
  color:var(--text2);transition:all .2s;
}
.tab.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.tab:hover:not(.active){background:#f1f5f9}

/* Daily progress */
.daily-progress{
  background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:14px;
}
.progress-ring{
  flex-shrink:0;width:60px;height:60px;border-radius:50%;
  background:conic-gradient(var(--primary) var(--progress,0%), #e2e8f0 0);
  display:flex;align-items:center;justify-content:center;
}
.progress-ring::before{
  content:'';width:44px;height:44px;border-radius:50%;background:#fff;
}
.progress-inner{
  position:absolute;font-size:.9rem;font-weight:700;color:var(--primary);
}
.progress-info{flex:1}
.progress-info .title{font-weight:600;font-size:.9rem}
.progress-info .sub{color:var(--text2);font-size:.75rem;margin-top:2px}
.btn-checkin{
  padding:10px 18px;background:var(--success);color:#fff;border:none;
  border-radius:20px;font-weight:600;font-size:.85rem;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.btn-checkin:hover{background:#16a34a}
.btn-checkin:active{transform:scale(.96)}
.btn-checkin.done{background:#cbd5e1;cursor:default}

/* Panel */
.panel{display:none;flex-direction:column;gap:14px}
.panel.active{display:flex}

/* Flashcards */
.flashcard-container{perspective:1000px;height:260px}
.flashcard{
  width:100%;height:100%;position:relative;transition:transform .5s;
  transform-style:preserve-3d;cursor:pointer;
}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:var(--radius);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;box-shadow:var(--shadow-lg);
}
.flashcard-front{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
.flashcard-front .word{font-size:2.2rem;font-weight:700;letter-spacing:1px}
.flashcard-front .phonetic{font-size:.9rem;opacity:.8;margin-top:6px}
.flashcard-back{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);color:#fff;transform:rotateY(180deg)}
.flashcard-back .meaning{font-size:1.5rem;font-weight:600}
.flashcard-back .example{font-size:.85rem;opacity:.9;margin-top:14px;text-align:center;line-height:1.5}
.card-hint{text-align:center;color:var(--text2);font-size:.75rem}
.card-progress{text-align:center;color:var(--text2);font-size:.8rem}
.card-progress span{color:var(--primary);font-weight:700}

/* Video section */
.video-toggle-btn{
  display:block;margin:0 auto;padding:6px 16px;background:#fb923c;color:#fff;
  border:none;border-radius:16px;font-size:.78rem;font-weight:600;cursor:pointer;
  transition:all .15s;
}
.video-toggle-btn:hover{background:#f97316}
.video-toggle-btn:active{transform:scale(.96)}
.video-panel{
  display:none;background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);
}
.video-panel.show{display:block}
.video-panel iframe{width:100%;height:200px;border:none}
.video-search-row{display:flex;gap:6px;padding:8px 10px}
.video-search-row button{
  flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:14px;
  background:var(--card);cursor:pointer;font-size:.75rem;color:var(--text2);
  transition:all .15s;white-space:nowrap;
}
.video-search-row button:hover{border-color:var(--primary);color:var(--primary);background:#eff6ff}
.video-search-row button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.card-actions{display:flex;gap:8px}
.card-actions button{
  flex:1;padding:11px;border:none;border-radius:10px;font-size:.85rem;
  font-weight:600;cursor:pointer;transition:all .15s;
}
.card-actions button:active{transform:scale(.96)}
.btn-forgot{background:#fef2f2;color:var(--danger)}
.btn-forgot:hover{background:#fee2e2}
.btn-hard{background:#fffbeb;color:#d97706}
.btn-hard:hover{background:#fef3c7}
.btn-good{background:#f0fdf4;color:#16a34a}
.btn-good:hover{background:#dcfce7}
.btn-easy{background:#eff6ff;color:#2563eb}
.btn-easy:hover{background:#dbeafe}

/* Quiz */
.quiz-type-selector{display:flex;gap:8px}
.quiz-type-btn{
  flex:1;padding:8px;border:2px solid var(--border);border-radius:8px;
  background:var(--card);cursor:pointer;font-size:.78rem;font-weight:500;
  text-align:center;transition:all .15s;
}
.quiz-type-btn.active{border-color:var(--primary);background:#eff6ff;color:var(--primary)}
.quiz-type-btn:hover:not(.active){border-color:#cbd5e1}

.quiz-word{text-align:center;font-size:1.8rem;font-weight:700;color:var(--primary);padding:16px}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-option{
  padding:13px 16px;background:var(--card);border:2px solid var(--border);
  border-radius:10px;cursor:pointer;font-size:.95rem;text-align:left;
  transition:all .15s;
}
.quiz-option:hover{border-color:var(--primary);background:#eff6ff}
.quiz-option.correct{border-color:var(--success);background:#f0fdf4}
.quiz-option.wrong{border-color:var(--danger);background:#fef2f2}
.quiz-option:disabled{pointer-events:none}
.quiz-input{
  padding:12px 16px;border:2px solid var(--border);border-radius:10px;
  font-size:1.1rem;text-align:center;outline:none;width:100%;
}
.quiz-input:focus{border-color:var(--primary)}
.quiz-result{text-align:center;font-weight:600;font-size:1rem;min-height:26px}
.quiz-next{
  padding:11px 28px;background:var(--primary);color:#fff;border:none;
  border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;
  align-self:center;transition:all .15s;
}
.quiz-next:hover{background:var(--primary-dark)}
.quiz-next:active{transform:scale(.96)}
.quiz-score{text-align:center;font-size:.85rem;color:var(--text2)}

/* Word list */
.word-list-header{display:flex;gap:8px}
.word-list-header input{
  flex:1;padding:9px 12px;border:2px solid var(--border);border-radius:10px;
  font-size:.85rem;outline:none;transition:border-color .2s;
}
.word-list-header input:focus{border-color:var(--primary)}
.word-list-header button,.word-list-header select{
  padding:9px 14px;background:var(--primary);color:#fff;border:none;
  border-radius:10px;font-weight:600;cursor:pointer;font-size:.85rem;
}
.word-list-header select{background:var(--card);color:var(--text);border:2px solid var(--border)}

.word-list{list-style:none}
.word-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:var(--card);border-radius:10px;margin-bottom:6px;
  box-shadow:var(--shadow);transition:transform .1s;
}
.word-item:hover{transform:translateX(3px)}
.word-item .eng{font-weight:600;min-width:90px;font-size:.9rem}
.word-item .chn{color:var(--text2);flex:1;font-size:.82rem}
.word-item .level{font-size:.68rem;padding:2px 7px;border-radius:20px;font-weight:600}
.level-new{background:#f1f5f9;color:#64748b}
.level-learning{background:#fef3c7;color:#b45309}
.level-mastered{background:#dcfce7;color:#15803d}
.word-item .del-btn{background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:1.1rem}
.word-item .del-btn:hover{color:var(--danger)}
.empty-state{text-align:center;color:var(--text2);padding:40px 20px}

/* Checkin tab */
.calendar-header{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.calendar-header button{
  background:none;border:none;font-size:1.2rem;cursor:pointer;
  color:var(--primary);padding:4px 8px;
}
.calendar-header .month-label{font-weight:600;font-size:1rem}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calendar-grid .day-label{font-size:.7rem;color:var(--text2);padding:4px 0}
.calendar-grid .day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:.8rem;cursor:default;
}
.calendar-grid .day.checked{background:var(--success);color:#fff;font-weight:600}
.calendar-grid .day.today{border:2px solid var(--primary);font-weight:600}
.calendar-grid .day.other{color:#cbd5e1}
.calendar-grid .day.future{color:var(--text2)}

.checkin-stats{display:flex;gap:8px}
.checkin-stat{
  flex:1;background:var(--card);border-radius:var(--radius);padding:12px;
  text-align:center;box-shadow:var(--shadow);
}
.checkin-stat .n{font-size:1.3rem;font-weight:700;color:var(--primary)}
.checkin-stat .l{font-size:.7rem;color:var(--text2)}

/* Add form */
.add-form{display:flex;flex-direction:column;gap:7px}
.add-form input{
  padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:.85rem;
}
.add-form input:focus{border-color:var(--primary);outline:none}
.add-form .btns{display:flex;gap:8px}
.add-form .btns button{flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.add-form .btns .btn-confirm{background:var(--success);color:#fff}
.add-form .btns .btn-cancel{background:#e2e8f0;color:var(--text)}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>四级单词天天背</h1>
  <p>每天30词 · 轻松过四级</p>
</header>

<div class="streak-badge">
  <div class="streak-item fire">
    <div class="val" id="streakDays">0</div>
    <div class="lbl">🔥 连续打卡</div>
  </div>
  <div class="streak-divider"></div>
  <div class="streak-item today">
    <div class="val" id="todayCount">0</div>
    <div class="lbl">📖 今日已学</div>
  </div>
  <div class="streak-divider"></div>
  <div class="streak-item">
    <div class="val" id="totalDays">0</div>
    <div class="lbl">📅 累计天数</div>
  </div>
</div>

<div class="daily-progress" id="dailyProgress">
  <div style="position:relative;display:inline-flex">
    <div class="progress-ring" id="progressRing" style="--progress:0%"></div>
    <div class="progress-inner" id="progressText">0/30</div>
  </div>
  <div class="progress-info">
    <div class="title">今日目标：30 个单词</div>
    <div class="sub" id="progressSub">还没开始，加油！</div>
  </div>
  <button class="btn-checkin" id="btnCheckin" onclick="doCheckin()">✅ 打卡</button>
</div>

<div class="tabs">
  <button class="tab active" data-panel="study">📖 背单词</button>
  <button class="tab" data-panel="quiz">✏️ 测验</button>
  <button class="tab" data-panel="list">📋 单词表</button>
  <button class="tab" data-panel="checkin">📅 打卡</button>
</div>

<!-- Study Panel -->
<div class="panel active" id="panel-study">
  <div class="flashcard-container">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-face flashcard-front">
        <div class="word" id="cardWord"></div>
        <div class="phonetic" id="cardPhonetic"></div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div class="meaning" id="cardMeaning"></div>
        <div class="example" id="cardExample"></div>
      </div>
    </div>
  </div>
  <div class="card-hint">👆 点击卡片翻转 · 空格键翻转 · ← → 切换</div>
  <div class="card-progress">今日进度：<span id="cardTodayCount">0</span> / 30</div>
  <div class="card-actions">
    <button class="btn-forgot" onclick="rateWord(0)">😰 忘了</button>
    <button class="btn-hard" onclick="rateWord(1)">🤔 困难</button>
    <button class="btn-good" onclick="rateWord(2)">👍 知道</button>
    <button class="btn-easy" onclick="rateWord(3)">🚀 简单</button>
  </div>
  <button class="video-toggle-btn" onclick="toggleVideo()">📺 B站学单词</button>
  <div class="video-panel" id="videoPanel">
    <div class="video-search-row">
      <button class="active" onclick="switchVideo('context',this)">📖 语境记词</button>
      <button onclick="switchVideo('core',this)">🎯 核心词速记</button>
      <button onclick="searchB站()">🔍 搜当前词</button>
    </div>
    <div id="videoPlayer"><iframe src="" allowfullscreen></iframe></div>
  </div>
</div>

<!-- Quiz Panel -->
<div class="panel" id="panel-quiz">
  <div class="quiz-type-selector">
    <button class="quiz-type-btn active" data-qtype="choice">🔤 英译中</button>
    <button class="quiz-type-btn" data-qtype="reverse">🀄 中译英</button>
    <button class="quiz-type-btn" data-qtype="spell">✍️ 拼写</button>
  </div>
  <div class="quiz-word" id="quizWord"></div>
  <div class="quiz-options" id="quizOptions"></div>
  <input class="quiz-input" id="quizInput" style="display:none" placeholder="输入英文单词..." autocomplete="off">
  <div class="quiz-result" id="quizResult"></div>
  <div class="quiz-score">得分：<span id="quizScore">0</span> / <span id="quizTotal">0</span></div>
  <button class="quiz-next" id="quizNext" style="display:none" onclick="nextQuiz()">下一题 →</button>
</div>

<!-- Word List Panel -->
<div class="panel" id="panel-list">
  <div class="word-list-header">
    <input type="text" id="searchInput" placeholder="🔍 搜索单词..." oninput="renderWordList()">
    <select id="levelFilter" onchange="renderWordList()">
      <option value="all">全部</option>
      <option value="new">新词</option>
      <option value="learning">学习中</option>
      <option value="mastered">已掌握</option>
    </select>
    <button onclick="showAddForm()">+ 添加</button>
  </div>
  <div class="add-form" id="addForm" style="display:none">
    <input type="text" id="addEnglish" placeholder="英文单词">
    <input type="text" id="addChinese" placeholder="中文释义">
    <input type="text" id="addPhonetic" placeholder="音标（可选）">
    <input type="text" id="addExample" placeholder="例句（可选）">
    <div class="btns">
      <button class="btn-confirm" onclick="addWord()">确认添加</button>
      <button class="btn-cancel" onclick="hideAddForm()">取消</button>
    </div>
  </div>
  <ul class="word-list" id="wordList"></ul>
</div>

<!-- Checkin Panel -->
<div class="panel" id="panel-checkin">
  <div class="calendar-header">
    <button onclick="changeMonth(-1)">◀</button>
    <span class="month-label" id="monthLabel"></span>
    <button onclick="changeMonth(1)">▶</button>
  </div>
  <div class="calendar-grid" id="calendarGrid"></div>
  <div class="checkin-stats">
    <div class="checkin-stat">
      <div class="n" id="csTotal">0</div><div class="l">累计打卡</div>
    </div>
    <div class="checkin-stat">
      <div class="n" id="csStreak">0</div><div class="l">最长连续</div>
    </div>
    <div class="checkin-stat">
      <div class="n" id="csMonth">0</div><div class="l">本月打卡</div>
    </div>
  </div>
</div>
</div>

<script>
// ===== CET-4 核心词汇表 (500词) =====
const CET4 = [
  ['abandon','抛弃；放弃','/əˈbændən/','He abandoned his plan.'],
  ['ability','能力；才能','/əˈbɪləti/','She has great ability.'],

  ['alarm','警报；使惊恐','/əˈlɑːrm/','The alarm went off.'],

// ===== 应用状态 =====
const STORAGE_KEY = 'cet4_words';
const CHECKIN_KEY = 'cet4_checkin';
const DAILY_KEY = 'cet4_daily';
const STATE_KEY = 'cet4_state';
const GOAL = 30;

let words = [];
let cardIndex = 0;
let isFlipped = false;
let currentQuiz = null;
let quizType = 'choice';
let quizScore = 0;
let quizTotal = 0;
let todayStudied = 0;
let checkedInToday = false;

// ===== 数据加载 =====
function loadWords() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    words = JSON.parse(saved);
  } else {
    words = CET4.map(w => ({ en: w[0], zh: w[1], phonetic: w[2], example: w[3], level: 0 }));
    saveWords();
  }
}
function saveWords() { localStorage.setItem(STORAGE_KEY, JSON.stringify(words)); }

function getToday() { return new Date().toISOString().slice(0, 10); }

function loadCheckins() {
  const saved = localStorage.getItem(CHECKIN_KEY);
  return saved ? JSON.parse(saved) : [];
}
function saveCheckins(arr) { localStorage.setItem(CHECKIN_KEY, JSON.stringify(arr)); }

function loadDaily() {
  const saved = localStorage.getItem(DAILY_KEY);
  if (saved) {
    const d = JSON.parse(saved);
    if (d.date !== getToday()) return { date: getToday(), count: 0 };
    return d;
  }
  return { date: getToday(), count: 0 };
}
function saveDaily(d) { localStorage.setItem(DAILY_KEY, JSON.stringify(d)); }

function loadState() {
  const saved = localStorage.getItem(STATE_KEY);
  if (saved) {
    const s = JSON.parse(saved);
    cardIndex = Math.min(s.cardIndex || 0, Math.max(0, words.length - 1));
    quizType = s.quizType || 'choice';
  }
}
function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify({ cardIndex, quizType })); }

// ===== 打卡系统 =====
function doCheckin() {
  const checkins = loadCheckins();
  const today = getToday();
  if (checkins.includes(today)) return;
  checkins.push(today);
  saveCheckins(checkins);
  checkedInToday = true;
  updateStreakUI();
  updateCalendar();
  const btn = document.getElementById('btnCheckin');
  btn.textContent = '✅ 已打卡';
  btn.classList.add('done');
}

function getStreak(checkins) {
  if (checkins.length === 0) return { streak: 0, total: 0 };
  const sorted = [...checkins].sort().reverse();
  let streak = 0;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  let d = new Date(today);

  while (true) {
    const ds = d.toISOString().slice(0, 10);
    if (sorted.includes(ds)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }

  // If not checked in today, the streak counts from yesterday
  if (!checkins.includes(getToday())) {
    streak = 0;
    d = new Date(today);
    d.setDate(d.getDate() - 1);
    while (true) {
      const ds = d.toISOString().slice(0, 10);
      if (sorted.includes(ds)) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else break;
    }
  }

  let maxStreak = 0, cur = 0;
  const allSorted = [...checkins].sort();
  for (let i = 0; i < allSorted.length; i++) {
    if (i === 0) { cur = 1; }
    else {
      const prev = new Date(allSorted[i - 1]);
      const curr = new Date(allSorted[i]);
      if ((curr - prev) / 86400000 === 1) cur++;
      else cur = 1;
    }
    maxStreak = Math.max(maxStreak, cur);
  }

  return { streak, total: checkins.length, maxStreak };
}

function updateStreakUI() {
  const checkins = loadCheckins();
  const { streak, total, maxStreak } = getStreak(checkins);
  const daily = loadDaily();
  todayStudied = daily.count;
  checkedInToday = checkins.includes(getToday());

  document.getElementById('streakDays').textContent = streak;
  document.getElementById('todayCount').textContent = todayStudied;
  document.getElementById('totalDays').textContent = total;

  const pct = Math.min(100, Math.round((todayStudied / GOAL) * 100));
  document.getElementById('progressRing').style.setProperty('--progress', pct + '%');
  document.getElementById('progressText').textContent = todayStudied + '/' + GOAL;
  document.getElementById('cardTodayCount').textContent = todayStudied;

  const sub = document.getElementById('progressSub');
  if (todayStudied >= GOAL) sub.textContent = '今日目标达成！真棒！';
  else if (todayStudied > 0) sub.textContent = '继续加油，你可以的！';
  else sub.textContent = '还没开始，加油！';

  const btn = document.getElementById('btnCheckin');
  if (checkedInToday) {
    btn.textContent = '✅ 已打卡';
    btn.classList.add('done');
  } else {
    btn.textContent = '✅ 打卡';
    btn.classList.remove('done');
  }

  document.getElementById('csTotal').textContent = total;
  document.getElementById('csStreak').textContent = maxStreak;
  document.getElementById('csMonth').textContent =
    checkins.filter(d => d.startsWith(getToday().slice(0, 7))).length;
}

// ===== 日历 =====
let calYear, calMonth;
function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth() + 1;
}

function updateCalendar() {
  const checkins = loadCheckins();
  const today = getToday();

  document.getElementById('monthLabel').textContent = calYear + '年 ' + calMonth + '月';

  const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth - 1, 0).getDate();

  const labels = ['日', '一', '二', '三', '四', '五', '六'];
  let html = labels.map(l => `<div class="day-label">${l}</div>`).join('');

  for (let i = firstDay - 1; i >= 0; i--) {
    const d = daysInPrev - i;
    const ds = `${calYear}-${String(calMonth - 1 || 12).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    html += `<div class="day other${checkins.includes(ds) ? ' checked' : ''}">${d}</div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    let cls = 'day';
    if (checkins.includes(ds)) cls += ' checked';
    if (ds === today) cls += ' today';
    else if (ds > today) cls += ' future';
    html += `<div class="${cls}">${d}</div>`;
  }

  const remaining = 42 - (firstDay + daysInMonth);
  for (let d = 1; d <= remaining; d++) {
    html += `<div class="day other">${d}</div>`;
  }

  document.getElementById('calendarGrid').innerHTML = html;
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1) { calMonth = 12; calYear--; }
  updateCalendar();
}

// ===== 闪卡学习 =====
function showCard() {
  if (words.length === 0) return;
  cardIndex = Math.min(cardIndex, words.length - 1);
  const w = words[cardIndex];
  document.getElementById('cardWord').textContent = w.en;
  document.getElementById('cardPhonetic').textContent = w.phonetic || '';
  document.getElementById('cardMeaning').textContent = w.zh;
  document.getElementById('cardExample').textContent = w.example ? '"' + w.example + '"' : '';
  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  saveState();
}

function flipCard() {
  if (words.length === 0) return;
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
}

function rateWord(rating) {
  if (words.length === 0) return;
  const w = words[cardIndex];
  if (rating >= 2) w.level = Math.min(3, w.level + 1);
  else if (rating === 0) w.level = Math.max(0, w.level - 1);
  saveWords();

  // 统计今日学习
  const daily = loadDaily();
  daily.count = Math.min(daily.count + 1, GOAL);
  saveDaily(daily);
  todayStudied = daily.count;

  updateStreakUI();

  // 自动打卡
  if (todayStudied >= GOAL && !checkedInToday) {
    doCheckin();
  }

  // 优先未掌握的单词
  const pool = words.filter(w => w.level < 2);
  if (pool.length > 0) {
    cardIndex = words.indexOf(pool[Math.floor(Math.random() * pool.length)]);
  } else {
    cardIndex = Math.floor(Math.random() * words.length);
  }
  showCard();
}

function nextCard(dir) {
  if (words.length === 0) return;
  cardIndex = (cardIndex + dir + words.length) % words.length;
  showCard();
}

// ===== 测验 =====
function switchQuizType(type) {
  quizType = type;
  quizScore = 0;
  quizTotal = 0;
  document.getElementById('quizScore').textContent = '0';
  document.getElementById('quizTotal').textContent = '0';
  document.querySelectorAll('.quiz-type-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-qtype="${type}"]`).classList.add('active');
  saveState();
  document.getElementById('quizInput').style.display = type === 'spell' ? 'block' : 'none';
  document.getElementById('quizOptions').style.display = type === 'spell' ? 'none' : 'flex';
  startQuiz();
}

function startQuiz() {
  if (words.length < 4 && quizType !== 'spell') {
    document.getElementById('quizWord').textContent = '至少需要4个单词';
    return;
  }
  document.getElementById('quizResult').textContent = '';
  document.getElementById('quizNext').style.display = 'none';

  const correctIdx = Math.floor(Math.random() * words.length);
  const correct = words[correctIdx];

  if (quizType === 'choice') {
    // 英译中
    const others = words.filter((_, i) => i !== correctIdx)
      .sort(() => Math.random() - .5).slice(0, 3);
    const options = [
      { zh: correct.zh, correct: true },
      ...others.map(w => ({ zh: w.zh, correct: false }))
    ].sort(() => Math.random() - .5);
    currentQuiz = { word: correct.en, options };
    document.getElementById('quizWord').textContent = correct.en;
    document.getElementById('quizOptions').innerHTML = options.map((o, i) =>
      `<button class="quiz-option" onclick="answerQuiz(${i})">${'ABCD'[i]}. ${o.zh}</button>`
    ).join('');
  } else if (quizType === 'reverse') {
    // 中译英
    const others = words.filter((_, i) => i !== correctIdx)
      .sort(() => Math.random() - .5).slice(0, 3);
    const options = [
      { en: correct.en, correct: true },
      ...others.map(w => ({ en: w.en, correct: false }))
    ].sort(() => Math.random() - .5);
    currentQuiz = { word: correct.zh, options };
    document.getElementById('quizWord').textContent = correct.zh;
    document.getElementById('quizOptions').innerHTML = options.map((o, i) =>
      `<button class="quiz-option" onclick="answerQuiz(${i})">${'ABCD'[i]}. ${o.en}</button>`
    ).join('');
  } else {
    // 拼写
    currentQuiz = { word: correct.en, answer: correct.en, hint: correct.zh };
    document.getElementById('quizWord').textContent = '请拼写：' + correct.zh;
    document.getElementById('quizInput').value = '';
    document.getElementById('quizInput').focus();
  }
}

function answerQuiz(index) {
  if (!currentQuiz) return;
  const correct = currentQuiz.options[index].correct;
  const buttons = document.querySelectorAll('.quiz-option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (currentQuiz.options[i].correct) btn.classList.add('correct');
    else if (i === index) btn.classList.add('wrong');
  });
  quizTotal++;
  if (correct) quizScore++;
  document.getElementById('quizScore').textContent = quizScore;
  document.getElementById('quizTotal').textContent = quizTotal;
  document.getElementById('quizResult').textContent = correct ? '✅ 正确！' : '❌ 错误！';
  document.getElementById('quizResult').style.color = correct ? 'var(--success)' : 'var(--danger)';
  document.getElementById('quizNext').style.display = 'block';

  if (correct) {
    const daily = loadDaily();
    daily.count = Math.min(daily.count + 1, GOAL);
    saveDaily(daily);
    updateStreakUI();
    if (todayStudied >= GOAL && !checkedInToday) doCheckin();
  }
}

function checkSpelling() {
  const input = document.getElementById('quizInput').value.trim();
  if (!input) return;
  quizTotal++;
  const correct = input.toLowerCase() === currentQuiz.answer.toLowerCase();
  if (correct) quizScore++;
  document.getElementById('quizScore').textContent = quizScore;
  document.getElementById('quizTotal').textContent = quizTotal;
  document.getElementById('quizResult').textContent = correct
    ? '✅ 正确！' : '❌ 错误！正确答案是：' + currentQuiz.answer;
  document.getElementById('quizResult').style.color = correct ? 'var(--success)' : 'var(--danger)';
  document.getElementById('quizNext').style.display = 'block';
  document.getElementById('quizInput').disabled = true;

  if (correct) {
    const daily = loadDaily();
    daily.count = Math.min(daily.count + 1, GOAL);
    saveDaily(daily);
    updateStreakUI();
    if (todayStudied >= GOAL && !checkedInToday) doCheckin();
  }
}

function nextQuiz() {
  document.getElementById('quizInput').disabled = false;
  startQuiz();
}

document.getElementById('quizInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkSpelling();
});

// ===== 单词表 =====
function getLevelLabel(level) {
  if (level >= 2) return { text: '已掌握', cls: 'level-mastered' };
  if (level === 1) return { text: '学习中', cls: 'level-learning' };
  return { text: '新词', cls: 'level-new' };
}

function renderWordList() {
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const lvlFilter = document.getElementById('levelFilter')?.value || 'all';

  let filtered = words;
  if (query) filtered = filtered.filter(w => w.en.toLowerCase().includes(query) || w.zh.includes(query));
  if (lvlFilter === 'new') filtered = filtered.filter(w => w.level === 0);
  if (lvlFilter === 'learning') filtered = filtered.filter(w => w.level === 1);
  if (lvlFilter === 'mastered') filtered = filtered.filter(w => w.level >= 2);

  const list = document.getElementById('wordList');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">📭<br>${query ? '没有匹配的单词' : '还没有单词'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(w => {
    const lvl = getLevelLabel(w.level);
    const idx = words.indexOf(w);
    return `<li class="word-item">
      <span class="eng">${w.en}</span>
      <span class="chn">${w.zh}</span>
      <span class="level ${lvl.cls}">${lvl.text}</span>
      <button class="del-btn" onclick="deleteWord(${idx})">×</button>
    </li>`;
  }).join('');
}

function deleteWord(idx) {
  if (words.length <= 1) { alert('至少保留一个单词！'); return; }
  if (confirm('确定删除 "' + words[idx].en + '" ？')) {
    words.splice(idx, 1);
    if (cardIndex >= words.length) cardIndex = words.length - 1;
    saveWords(); showCard(); renderWordList(); updateStreakUI();
  }
}

function showAddForm() {
  document.getElementById('addForm').style.display = 'flex';
  document.getElementById('addEnglish').focus();
}
function hideAddForm() {
  document.getElementById('addForm').style.display = 'none';
  document.getElementById('addEnglish').value = '';
  document.getElementById('addChinese').value = '';
  document.getElementById('addPhonetic').value = '';
  document.getElementById('addExample').value = '';
}
function addWord() {
  const en = document.getElementById('addEnglish').value.trim();
  const zh = document.getElementById('addChinese').value.trim();
  if (!en || !zh) { alert('请填写英文和中文'); return; }
  if (words.some(w => w.en.toLowerCase() === en.toLowerCase())) { alert('已存在！'); return; }
  words.push({
    en, zh,
    phonetic: document.getElementById('addPhonetic').value.trim(),
    example: document.getElementById('addExample').value.trim(),
    level: 0
  });
  saveWords(); renderWordList(); hideAddForm(); updateStreakUI();
}

// ===== 标签切换 =====
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    if (tab.dataset.panel === 'quiz') startQuiz();
    if (tab.dataset.panel === 'list') renderWordList();
    if (tab.dataset.panel === 'study') showCard();
    if (tab.dataset.panel === 'checkin') updateCalendar();
  });
});

// Quiz type switching
document.querySelectorAll('.quiz-type-btn').forEach(btn => {
  btn.addEventListener('click', () => switchQuizType(btn.dataset.qtype));
});

document.getElementById('addChinese')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') addWord();
});

// 键盘快捷键
document.addEventListener('keydown', e => {
  const active = document.querySelector('.panel.active');
  if (!active) return;
  if (active.id === 'panel-study') {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flipCard(); }
    if (e.key === 'ArrowLeft') nextCard(-1);
    if (e.key === 'ArrowRight') nextCard(1);
    if (e.key === '1') rateWord(0);
    if (e.key === '2') rateWord(1);
    if (e.key === '3') rateWord(2);
    if (e.key === '4') rateWord(3);
  }
});
